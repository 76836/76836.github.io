<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Batteries</title>
<style>
  :root {
    --bg: #070707;
    --card: #121212;
    --elev: #1c1c1c;
    --border: #2c2c2c;
    --text: #f5f5f5;
    --muted: #8b8b8b;
    --accent: #7dd3fc;
    --warn: #fbbf24;
    --danger: #f87171;
    --ok: #4ade80;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100dvh;
    padding: calc(14px + var(--safe-t)) 14px calc(92px + var(--safe-b));
    overscroll-behavior-y: contain;
  }
  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; margin-bottom: 16px;
  }
  h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.03em; }
  .sub { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  .hdr-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 12px 10px; font-size: 0.92rem; cursor: pointer;
    min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #fff; color: #000; border-color: #fff; font-weight: 700; }
  .btn-ok { background: var(--ok); color: #052e16; border-color: var(--ok); font-weight: 700; }
  .btn-dead { background: transparent; color: var(--danger); border-color: #5a2020; font-weight: 650; }
  .btn-danger { border-color: #4a1515; color: var(--danger); background: transparent; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px; display: grid; grid-template-columns: 48px 1fr auto; gap: 10px 12px; align-items: center;
  }
  .card.due { border-color: rgba(251,191,36,0.5); }
  .card.low { border-color: rgba(248,113,113,0.5); }
  .dev-icon {
    width: 48px; height: 48px; border-radius: 12px; background: var(--elev);
    display: grid; place-items: center;
  }
  .dev-icon svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .name { font-weight: 650; font-size: 1rem; }
  .meta { color: var(--muted); font-size: 0.72rem; margin-top: 3px; line-height: 1.35; }
  .pct { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; text-align: right; min-width: 3rem; }
  .pct.ok { color: var(--ok); } .pct.warn { color: var(--warn); } .pct.low { color: var(--danger); }
  .bar { grid-column: 1 / -1; height: 6px; background: #222; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; }
  .actions-row { grid-column: 1 / -1; display: flex; gap: 8px; }
  .actions-row .btn { flex: 1; }
  .empty {
    text-align: center; color: var(--muted); padding: 48px 16px;
    border: 1px dashed var(--border); border-radius: 16px; line-height: 1.5;
  }
  .fab {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 14px calc(12px + var(--safe-b));
    background: linear-gradient(transparent, var(--bg) 35%);
    display: flex; justify-content: center; pointer-events: none;
  }
  .fab .btn { pointer-events: auto; width: min(100%, 420px); }
  .toast {
    position: fixed; top: calc(12px + var(--safe-t)); left: 50%; transform: translateX(-50%);
    background: #1a1a1a; border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px;
    font-size: 0.85rem; z-index: 90; opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  dialog.sheet {
    border: none; padding: 0; margin: 0; width: 100%; max-width: 100%;
    max-height: min(94dvh, 920px); border-radius: 20px 20px 0 0;
    background: #0e0e0e; color: var(--text);
    position: fixed; bottom: 0; top: auto; left: 0; right: 0;
  }
  dialog.sheet::backdrop { background: rgba(0,0,0,0.75); }
  .sheet-handle { width: 36px; height: 4px; background: #333; border-radius: 99px; margin: 10px auto 0; }
  .dlg-h { padding: 14px 18px 6px; font-weight: 700; font-size: 1.2rem; letter-spacing: -0.02em; }
  .dlg-b {
    padding: 8px 18px 12px; display: flex; flex-direction: column; gap: 16px;
    overflow-y: auto; max-height: calc(94dvh - 132px); -webkit-overflow-scrolling: touch;
  }
  .dlg-f {
    padding: 12px 18px calc(14px + var(--safe-b)); display: flex; gap: 8px;
    border-top: 1px solid var(--border);
  }
  .dlg-f .btn { flex: 1; }
  label {
    font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  input[type="text"], input[type="number"] {
    width: 100%; background: var(--elev); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 13px 14px; font-size: 1rem; min-height: 48px;
  }
  input:focus { outline: none; border-color: #555; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slider-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .slider-val { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); font-size: 0.95rem; }
  input[type="range"] { width: 100%; height: 36px; accent-color: var(--accent); }

  .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (min-width: 400px) { .icon-grid { grid-template-columns: repeat(5, 1fr); } }
  .icon-cell {
    aspect-ratio: 1; border-radius: 14px; border: 1px solid transparent; background: var(--elev);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer; padding: 8px 4px;
  }
  .icon-cell.selected { border-color: var(--accent); background: rgba(125,211,252,0.1); }
  .icon-cell svg { width: 26px; height: 26px; stroke: #e8e8e8; fill: none; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
  .icon-cell.selected svg { stroke: var(--accent); }
  .icon-cell span {
    font-size: 0.6rem; color: var(--muted); text-align: center; line-height: 1.1;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .icon-cell.selected span { color: var(--accent); }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row span { font-size: 0.95rem; }
  .toggle-row small { display: block; color: var(--muted); font-size: 0.75rem; margin-top: 3px; }
  .switch {
    width: 48px; height: 28px; border-radius: 99px; background: #333; position: relative;
    border: none; cursor: pointer; flex-shrink: 0;
  }
  .switch.on { background: var(--accent); }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .switch.on::after { transform: translateX(20px); }

  .checkin-card {
    text-align: center; padding: 8px 0 4px;
  }
  .checkin-card .dev-icon { margin: 0 auto 12px; width: 64px; height: 64px; border-radius: 16px; }
  .checkin-card .dev-icon svg { width: 34px; height: 34px; }
  .checkin-card h2 { font-size: 1.15rem; margin-bottom: 4px; }
  .checkin-card p { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }

  @media (min-width: 640px) {
    body { max-width: 480px; margin: 0 auto; }
    dialog.sheet {
      max-width: 420px; margin: auto; border-radius: 18px;
      top: 50%; bottom: auto; left: 50%; transform: translate(-50%, -50%);
      max-height: min(88vh, 760px);
    }
    .sheet-handle { display: none; }
    .dlg-b { max-height: min(62vh, 560px); }
    .dlg-f { padding-bottom: 14px; }
  }
</style>
</head>

<header>
  <div>
    <h1>Batteries</h1>
    <div class="sub">Charged / dead · learns cycles · check-ins</div>
  </div>
  <div class="hdr-actions">
    <button class="icon-btn" type="button" id="btnSettings" aria-label="Settings">
      <svg><use href="#i-gear"/></svg>
    </button>
    <button class="icon-btn" type="button" id="btnNotif" aria-label="Enable notifications">
      <svg><use href="#i-bell"/></svg>
    </button>
  </div>
</header>

<div id="list" class="list"></div>
<div class="fab"><button class="btn btn-primary" type="button" id="btnAdd">+ Device</button></div>
<div class="toast" id="toast"></div>

<dialog class="sheet" id="dlg">
  <div class="sheet-handle"></div>
  <div class="dlg-h" id="dlgTitle">Add device</div>
  <div class="dlg-b">
    <div>
      <label>Name</label>
      <input id="fName" placeholder="Optional — fills from icon" autocomplete="off">
    </div>
    <div>
      <label>Icon</label>
      <div class="icon-grid" id="iconDrawer" role="listbox"></div>
    </div>
    <div>
      <div class="slider-top">
        <label style="margin:0">Charge</label>
        <span class="slider-val"><span id="fPctLabel">100</span>%</span>
      </div>
      <input id="fPct" type="range" min="0" max="100" value="100" step="1">
    </div>
    <div class="row2">
      <div>
        <label>Remind at %</label>
        <input id="fLow" type="number" min="1" max="50" value="20" inputmode="numeric">
      </div>
      <div>
        <label>Interval (hours)</label>
        <input id="fInterval" type="number" min="0" step="0.5" placeholder="Auto" inputmode="decimal">
      </div>
    </div>
    <div>
      <label>Learned cycle (hours)</label>
      <input id="fLife" type="number" min="0" step="0.25" placeholder="Learns over time" inputmode="decimal">
    </div>
  </div>
  <div class="dlg-f">
    <button class="btn btn-danger" type="button" id="btnDelete" hidden>Delete</button>
    <button class="btn" type="button" id="btnCancel">Cancel</button>
    <button class="btn btn-primary" type="button" id="btnSave">Save</button>
  </div>
</dialog>

<dialog class="sheet" id="dlgSettings">
  <div class="sheet-handle"></div>
  <div class="dlg-h">Settings</div>
  <div class="dlg-b">
    <div class="toggle-row">
      <div>
        <span>Check-in notifications</span>
        <small>Occasionally ask how charged a device is so learning stays accurate</small>
      </div>
      <button type="button" class="switch" id="swCheckins" aria-pressed="true"></button>
    </div>
    <div class="toggle-row">
      <div>
        <span>Low-battery reminders</span>
        <small>Notify when estimated charge hits your threshold</small>
      </div>
      <button type="button" class="switch on" id="swLow" aria-pressed="true"></button>
    </div>
  </div>
  <div class="dlg-f">
    <button class="btn btn-primary" type="button" id="btnSettingsClose">Done</button>
  </div>
</dialog>

<dialog class="sheet" id="dlgCheckin">
  <div class="sheet-handle"></div>
  <div class="dlg-h">Quick check-in</div>
  <div class="dlg-b">
    <div class="checkin-card">
      <div class="dev-icon" id="ciIcon"></div>
      <h2 id="ciName">Device</h2>
      <p>How charged is it right now?</p>
      <div class="slider-top">
        <label style="margin:0">Charge</label>
        <span class="slider-val"><span id="ciPctLabel">50</span>%</span>
      </div>
      <input id="ciPct" type="range" min="0" max="100" value="50" step="1">
    </div>
  </div>
  <div class="dlg-f">
    <button class="btn btn-dead" type="button" id="ciDead">Dead</button>
    <button class="btn btn-ok" type="button" id="ciCharged">Full</button>
    <button class="btn btn-primary" type="button" id="ciSave">Save</button>
  </div>
</dialog>

const CHECKIN_GAP_MS = 18 * 3600000; // ~18h between check-ins per device
const CHECKIN_MIN_AGE_MS = 4 * 3600000; // only after 4h since last charge/report

  { id: 'ebike', label: 'E-bike', name: 'E-bike', keywords: ['e-bike','ebike'] },
  { id: 'scooter', label: 'Scooter', name: 'Scooter', keywords: ['scooter'] },
  { id: 'toothbrush', label: 'Toothbrush', name: 'Toothbrush', keywords: ['toothbrush','oral-b'] },
  { id: 'shaver', label: 'Shaver', name: 'Shaver', keywords: ['shaver','trimmer'] },
  { id: 'calculator', label: 'Calculator', name: 'Calculator', keywords: ['calculator'] },
  { id: 'flashlight', label: 'Flashlight', name: 'Flashlight', keywords: ['flashlight','torch'] },
  { id: 'router', label: 'Hotspot', name: 'Hotspot', keywords: ['router','hotspot'] },
  { id: 'console', label: 'Console', name: 'Handheld', keywords: ['switch','steam deck'] },
  { id: 'radio', label: 'Radio', name: 'Radio', keywords: ['radio'] },
  { id: 'light', label: 'Light', name: 'Light', keywords: ['lamp','light'] },
  { id: 'vacuum', label: 'Vacuum', name: 'Vacuum', keywords: ['vacuum','roomba'] },
  { id: 'pen', label: 'Stylus', name: 'Stylus', keywords: ['stylus','pencil'] },
  { id: 'remote', label: 'Remote', name: 'Remote', keywords: ['remote'] },
  { id: 'ring', label: 'Ring', name: 'Smart ring', keywords: ['ring','oura'] },
  { id: 'ssd', label: 'SSD', name: 'SSD', keywords: ['ssd'] },
  { id: 'monitor', label: 'Monitor', name: 'Monitor', keywords: ['monitor'] },
  { id: 'car', label: 'Car key', name: 'Car key', keywords: ['car key','fob'] },
  { id: 'fan', label: 'Fan', name: 'Fan', keywords: ['fan'] },
  { id: 'hearing', label: 'Hearing', name: 'Hearing aid', keywords: ['hearing'] },
  { id: 'battery', label: 'Battery', name: 'Battery', keywords: ['18650'] },
  { id: 'other', label: 'Other', name: 'Device', keywords: [] }
];
const ICON_IDS = TYPES.map(t => t.id);
const byId = Object.fromEntries(TYPES.map(t => [t.id, t]));

function svgUse(id) { return '<svg aria-hidden="true"><use href="#i-' + id + '"/></svg>'; }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { devices: [], settings: { checkins: true, lowReminders: true }, version: 4 };
    const data = JSON.parse(raw);
    if (!data.devices) data.devices = [];
    if (!data.settings) data.settings = { checkins: true, lowReminders: true };
    if (data.settings.checkins == null) data.settings.checkins = true;
    if (data.settings.lowReminders == null) data.settings.lowReminders = true;
    data.devices.forEach(d => {
      if (!d.icon) d.icon = d.type || 'other';
      if (!ICON_IDS.includes(d.icon) || d.icon === 'vape') d.icon = 'other';
    });
    return data;
  } catch {
    return { devices: [], settings: { checkins: true, lowReminders: true }, version: 4 };
  }
}
function save(data) {
  data.updatedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

function fmtDuration(ms) {
  if (!ms || ms <= 0 || !isFinite(ms)) return '—';
  const h = ms / 3600000;
  if (h < 1) return Math.round(ms / 60000) + 'm';
  if (h < 48) return (Math.round(h * 10) / 10) + 'h';
  return (Math.round(h / 24 * 10) / 10) + 'd';
}

function detectType(name) {
  const n = String(name || '').toLowerCase();
  for (const t of TYPES) {
    if (t.id === 'other') continue;
    if (t.keywords.some(k => n.includes(k))) return t.id;
  }
  return 'other';
}

/** Learn from a full cycle (charge → dead) or partial report */
function learnFromSpan(d, spanMs, fromPct, toPct) {
  if (!spanMs || spanMs < 20 * 60000 || spanMs > 45 * 86400000) return;
  const drop = Math.max(1, (fromPct != null ? fromPct : 100) - (toPct != null ? toPct : 0));
  // Extrapolate to full 100%→0% life
  const fullLife = spanMs * (100 / drop);
  if (fullLife < 30 * 60000 || fullLife > 45 * 86400000) return;
  const prev = d.learnedLifeMs || fullLife;
  d.learnedLifeMs = Math.round(prev * 0.55 + fullLife * 0.45);
  d.cycles = (d.cycles || 0) + 1;
  d.lastCycleMs = spanMs;
}

function estimatePct(d, now = Date.now()) {
  if (d.pctManual) return clamp(d.lastPct != null ? d.lastPct : 100, 0, 100);
  if (d.manualIntervalHours && d.manualIntervalHours > 0) {
    const life = d.manualIntervalHours * 3600000;
    const elapsed = now - (d.lastChargedAt || now);
    const span = life / Math.max(0.05, (100 - (d.lowAt || 20)) / 100);
    return Math.round(100 * (1 - Math.min(1, Math.max(0, elapsed / span))));
  }
  const life = d.learnedLifeMs;
  if (!life || life <= 0) return d.lastPct != null ? d.lastPct : 100;
  const origin = d.lastReportAt || d.lastChargedAt || now;
  const originPct = d.lastPct != null ? d.lastPct : 100;
  const elapsed = now - origin;
  const used = (elapsed / life) * 100;
  return clamp(Math.round(originPct - used), 0, 100);
}

function dueAt(d) {
  const low = d.lowAt != null ? d.lowAt : 20;
  if (d.manualIntervalHours && d.manualIntervalHours > 0)
    return (d.lastChargedAt || Date.now()) + d.manualIntervalHours * 3600000;
  const life = d.learnedLifeMs;
  if (!life) return null;
  const origin = d.lastReportAt || d.lastChargedAt;
  if (!origin) return null;
  const originPct = d.lastPct != null ? d.lastPct : 100;
  if (originPct <= low) return origin;
  const hoursFrac = (originPct - low) / 100;
  return origin + life * hoursFrac;
}

function markCharged(d) {
  const now = Date.now();
  d.lastChargedAt = now;
  d.lastReportAt = now;
  d.lastPct = 100;
  d.pctManual = false;
  d.notifiedForCharge = null;
  d.lastCheckinAt = now;
}

function markDead(d) {
  const now = Date.now();
  const fromPct = d.lastPct != null ? d.lastPct : 100;
  const origin = d.lastReportAt || d.lastChargedAt;
  if (origin) learnFromSpan(d, now - origin, fromPct, 0);
  d.lastReportAt = now;
  d.lastPct = 0;
  d.pctManual = true;
  d.notifiedForCharge = d.lastChargedAt;
  d.lastCheckinAt = now;
}

function reportPct(d, pct) {
  const now = Date.now();
  pct = clamp(pct, 0, 100);
  const fromPct = d.lastPct != null ? d.lastPct : estimatePct(d, now);
  const origin = d.lastReportAt || d.lastChargedAt;
  if (origin && fromPct > pct) learnFromSpan(d, now - origin, fromPct, pct);
  if (pct >= 95) {
    markCharged(d);
    d.lastPct = pct;
    return;
  }
  if (pct <= 2) {
    markDead(d);
    return;
  }
  d.lastReportAt = now;
  d.lastPct = pct;
  d.pctManual = true;
  d.lastCheckinAt = now;
  if (pct > (d.lowAt || 20)) d.notifiedForCharge = null;
}

let state = load();
let editId = null;
let selectedIcon = 'other';
let nameFromIcon = true;
let checkinDeviceId = null;

function renderIconDrawer() {
  document.getElementById('iconDrawer').innerHTML = TYPES.map(t => `
    <button type="button" class="icon-cell${selectedIcon === t.id ? ' selected' : ''}" data-icon="${t.id}">
      ${svgUse(t.id)}<span>${escapeHtml(t.label)}</span>
    </button>`).join('');
}

function selectIcon(id, { fillName } = { fillName: true }) {
  selectedIcon = ICON_IDS.includes(id) ? id : 'other';
  renderIconDrawer();
  if (fillName) {
    const t = byId[selectedIcon];
    const nameEl = document.getElementById('fName');
    if (nameFromIcon || !nameEl.value.trim()) {
      nameEl.value = t ? t.name : '';
      nameFromIcon = true;
    }
  }
}

function render() {
  const root = document.getElementById('list');
  const now = Date.now();
  if (!state.devices.length) {
    root.innerHTML = '<div class="empty">No devices yet.<br>Add something, then tap Charged or Dead to teach it.</div>';
    return;
  }
  const sorted = state.devices.slice().sort((a, b) => estimatePct(a, now) - estimatePct(b, now));
  root.innerHTML = sorted.map(d => {
    const pct = estimatePct(d, now);
    const due = dueAt(d);
    const isDue = due && now >= due;
    const cls = pct <= (d.lowAt || 20) ? 'low' : (isDue ? 'due' : '');
    const pctCls = pct <= (d.lowAt || 20) ? 'low' : (pct <= 40 ? 'warn' : 'ok');
    const lifeLabel = d.manualIntervalHours
      ? `every ${d.manualIntervalHours}h`
      : (d.learnedLifeMs ? `~${fmtDuration(d.learnedLifeMs)} cycle` : 'learning…');
    const dueLabel = due ? (now >= due ? 'due now' : 'low in ' + fmtDuration(due - now)) : 'mark charged / dead to learn';
    const icon = d.icon || d.type || 'other';
    const bar = pct <= 20 ? 'var(--danger)' : pct <= 40 ? 'var(--warn)' : 'var(--accent)';
    return `<article class="card ${cls}" data-id="${d.id}">
      <div class="dev-icon">${svgUse(icon)}</div>
      <div>
        <div class="name">${escapeHtml(d.name)}</div>
        <div class="meta">${escapeHtml((byId[icon] || {}).label || '')} · ${lifeLabel}<br>${dueLabel}</div>
      </div>
      <div class="pct ${pctCls}">${pct}%</div>
      <div class="bar"><i style="width:${Math.max(2,pct)}%;background:${bar}"></i></div>
      <div class="actions-row">
        <button class="btn btn-ok" type="button" data-act="charged">Charged</button>
        <button class="btn btn-dead" type="button" data-act="dead">Dead</button>
        <button class="btn" type="button" data-act="edit">Edit</button>
      </div>
    </article>`;
  }).join('');
}

document.getElementById('list').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  const card = e.target.closest('[data-id]');
  if (!card || !btn) return;
  const d = state.devices.find(x => x.id === card.dataset.id);
  if (!d) return;
  if (btn.dataset.act === 'charged') {
    markCharged(d); save(state); render(); scheduleChecks();
    toast(d.name + ' charged');
  } else if (btn.dataset.act === 'dead') {
    markDead(d); save(state); render(); scheduleChecks();
    toast(d.name + ' dead — cycle learned');
  } else if (btn.dataset.act === 'edit') openEdit(d);
});

document.getElementById('iconDrawer').addEventListener('click', (e) => {
  const cell = e.target.closest('[data-icon]');
  if (cell) selectIcon(cell.dataset.icon, { fillName: true });
});

document.getElementById('fName').addEventListener('input', () => {
  nameFromIcon = false;
  const det = detectType(document.getElementById('fName').value);
  if (det !== 'other') selectIcon(det, { fillName: false });
});
document.getElementById('fPct').addEventListener('input', () => {
  document.getElementById('fPctLabel').textContent = document.getElementById('fPct').value;
});
document.getElementById('ciPct').addEventListener('input', () => {
  document.getElementById('ciPctLabel').textContent = document.getElementById('ciPct').value;
});

function openEdit(d) {
  editId = d ? d.id : null;
  nameFromIcon = !d;
  document.getElementById('dlgTitle').textContent = d ? 'Edit device' : 'Add device';
  document.getElementById('fName').value = d ? d.name : '';
  const pct = d ? (d.lastPct != null ? d.lastPct : estimatePct(d)) : 100;
  document.getElementById('fPct').value = pct;
  document.getElementById('fPctLabel').textContent = String(pct);
  document.getElementById('fLow').value = d && d.lowAt != null ? d.lowAt : 20;
  document.getElementById('fInterval').value = d && d.manualIntervalHours ? d.manualIntervalHours : '';
  document.getElementById('fLife').value = d && d.learnedLifeMs ? (d.learnedLifeMs / 3600000).toFixed(2) : '';
  selectIcon(d ? (d.icon || d.type || 'other') : 'other', { fillName: !d });
  document.getElementById('btnDelete').hidden = !d;
  document.getElementById('dlg').showModal();
}

function openCheckin(d) {
  checkinDeviceId = d.id;
  const pct = estimatePct(d);
  document.getElementById('ciName').textContent = d.name;
  document.getElementById('ciIcon').innerHTML = svgUse(d.icon || d.type || 'other');
  document.getElementById('ciPct').value = pct;
  document.getElementById('ciPctLabel').textContent = String(pct);
  document.getElementById('dlgCheckin').showModal();
}

document.getElementById('btnAdd').onclick = () => openEdit(null);
document.getElementById('btnCancel').onclick = () => document.getElementById('dlg').close();
document.getElementById('btnDelete').onclick = () => {
  if (!editId) return;
  state.devices = state.devices.filter(x => x.id !== editId);
  save(state); document.getElementById('dlg').close(); render();
};

function notify(title, body, url) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      const n = new Notification(title, { body, tag: 'batteries-' + (url || Date.now()) });
      if (url) {
        n.onclick = () => {
          window.focus();
          location.href = url;
          n.close();
        };
      }
    } catch (_) {}
  }
  toast(title + (body ? ' — ' + body : ''));
}

document.getElementById('btnSave').onclick = async () => {
  let name = document.getElementById('fName').value.trim();
  if (!name) name = (byId[selectedIcon] || {}).name || 'Device';
  const lastPct = clamp(parseInt(document.getElementById('fPct').value, 10) || 0, 0, 100);
  const lowAt = clamp(parseInt(document.getElementById('fLow').value, 10) || 20, 1, 50);
  const intervalRaw = document.getElementById('fInterval').value;
  const lifeRaw = document.getElementById('fLife').value;
  const isNew = !editId;
  let d = editId ? state.devices.find(x => x.id === editId) : null;
  if (!d) {
    d = {
      id: uid(), name, type: selectedIcon, icon: selectedIcon,
      lastChargedAt: Date.now(), lastReportAt: Date.now(), lastPct, lowAt,
      cycles: 0, pctManual: true, lastCheckinAt: Date.now()
    };
    state.devices.push(d);
  } else {
    d.name = name; d.type = selectedIcon; d.icon = selectedIcon;
    d.lastPct = lastPct; d.lowAt = lowAt; d.pctManual = true;
    d.lastReportAt = Date.now();
  }
  if (intervalRaw === '' || intervalRaw == null) d.manualIntervalHours = null;
  else d.manualIntervalHours = Math.max(0, parseFloat(intervalRaw) || 0) || null;
  if (lifeRaw !== '' && lifeRaw != null) {
    const h = parseFloat(lifeRaw);
    if (h > 0) d.learnedLifeMs = Math.round(h * 3600000);
  }
  save(state);
  document.getElementById('dlg').close();
  render();
  scheduleChecks();
  if (isNew) {
    if ('Notification' in window && Notification.permission === 'default') {
      try { await Notification.requestPermission(); } catch (_) {}
    }
    notify(d.name + ' added', 'Battery at ' + lastPct + '%');
  }
};

// Check-in dialog actions
document.getElementById('ciSave').onclick = () => {
  const d = state.devices.find(x => x.id === checkinDeviceId);
  if (!d) return document.getElementById('dlgCheckin').close();
  const pct = parseInt(document.getElementById('ciPct').value, 10) || 0;
  reportPct(d, pct);
  save(state);
  document.getElementById('dlgCheckin').close();
  render();
  toast(d.name + ' → ' + pct + '%');
  // clear query
  if (location.search) history.replaceState({}, '', location.pathname);
};
document.getElementById('ciCharged').onclick = () => {
  const d = state.devices.find(x => x.id === checkinDeviceId);
  if (!d) return;
  markCharged(d); save(state);
  document.getElementById('dlgCheckin').close();
  render();
  toast(d.name + ' charged');
  if (location.search) history.replaceState({}, '', location.pathname);
};
document.getElementById('ciDead').onclick = () => {
  const d = state.devices.find(x => x.id === checkinDeviceId);
  if (!d) return;
  markDead(d); save(state);
  document.getElementById('dlgCheckin').close();
  render();
  toast(d.name + ' dead — cycle learned');
  if (location.search) history.replaceState({}, '', location.pathname);
};

// Settings
function syncSettingsUI() {
  document.getElementById('swCheckins').classList.toggle('on', !!state.settings.checkins);
  document.getElementById('swLow').classList.toggle('on', !!state.settings.lowReminders);
}
document.getElementById('btnSettings').onclick = () => {
  syncSettingsUI();
  document.getElementById('dlgSettings').showModal();
};
document.getElementById('btnSettingsClose').onclick = () => document.getElementById('dlgSettings').close();
document.getElementById('swCheckins').onclick = () => {
  state.settings.checkins = !state.settings.checkins;
  save(state); syncSettingsUI();
};
document.getElementById('swLow').onclick = () => {
  state.settings.lowReminders = !state.settings.lowReminders;
  save(state); syncSettingsUI();
};

document.getElementById('btnNotif').onclick = async () => {
  if (!('Notification' in window)) return toast('Notifications unavailable');
  const r = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  toast(r === 'granted' ? 'Notifications enabled' : 'Notifications blocked');
};

function maybeLowNotify(d, now) {
  if (!state.settings.lowReminders) return;
  const due = dueAt(d);
  if (!due || now < due) return;
  if (d.notifiedForCharge === (d.lastChargedAt || d.lastReportAt)) return;
  d.notifiedForCharge = d.lastChargedAt || d.lastReportAt;
  const url = location.origin + location.pathname + '?check=' + encodeURIComponent(d.id);
  notify(d.name + ' battery low', 'Estimated ~' + estimatePct(d, now) + '% — tap to update', url);
}

function maybeCheckinNotify(d, now) {
  if (!state.settings.checkins) return;
  if (!d.lastChargedAt && !d.lastReportAt) return;
  const last = d.lastCheckinAt || d.lastReportAt || d.lastChargedAt || 0;
  if (now - last < CHECKIN_GAP_MS) return;
  const origin = d.lastReportAt || d.lastChargedAt || 0;
  if (now - origin < CHECKIN_MIN_AGE_MS) return;
  // Prefer devices with little learning data or uncertain estimate
  const curious = !d.learnedLifeMs || (d.cycles || 0) < 3 || d.pctManual;
  if (!curious && (d.cycles || 0) >= 5) {
    // still occasional check every ~3 days worth of gaps
    if (now - last < CHECKIN_GAP_MS * 3) return;
  }
  if (d.lastCheckinNotifAt && now - d.lastCheckinNotifAt < CHECKIN_GAP_MS) return;
  d.lastCheckinNotifAt = now;
  const url = location.origin + location.pathname + '?check=' + encodeURIComponent(d.id);
  notify('Checking in: ' + d.name, 'How charged is it? Tap to set the slider.', url);
}

function scheduleChecks() {
  const now = Date.now();
  let changed = false;
  // One check-in notif max per tick
  let checkinSent = false;
  state.devices.forEach(d => {
    const before = JSON.stringify([d.notifiedForCharge, d.lastCheckinNotifAt]);
    maybeLowNotify(d, now);
    if (!checkinSent) {
      const prev = d.lastCheckinNotifAt;
      maybeCheckinNotify(d, now);
      if (d.lastCheckinNotifAt !== prev) checkinSent = true;
    }
    const after = JSON.stringify([d.notifiedForCharge, d.lastCheckinNotifAt]);
    if (before !== after) changed = true;
  });
  if (changed) save(state);
  render();
}

// Deep link: ?check=id
(function handleDeepLink() {
  const params = new URLSearchParams(location.search);
  const id = params.get('check');
  if (!id) return;
  const d = state.devices.find(x => x.id === id);
  if (d) setTimeout(() => openCheckin(d), 200);
})();

render();
scheduleChecks();
setInterval(scheduleChecks, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleChecks(); });
</script>
