<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Batteries</title>
<style>
  :root {
    --bg: #070707;
    --card: #121212;
    --elev: #1c1c1c;
    --border: #2c2c2c;
    --text: #f5f5f5;
    --muted: #8b8b8b;
    --accent: #7dd3fc;
    --warn: #fbbf24;
    --danger: #f87171;
    --ok: #4ade80;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: calc(14px + var(--safe-t)) 14px calc(92px + var(--safe-b));
    overscroll-behavior-y: contain;
  }
  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 16px;
  }
  h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.03em; }
  .sub { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 12px 14px; font-size: 0.95rem; cursor: pointer;
    min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #fff; color: #000; border-color: #fff; font-weight: 700; }
  .btn-ok { background: var(--ok); color: #052e16; border-color: var(--ok); font-weight: 700; }
  .btn-danger { border-color: #4a1515; color: var(--danger); background: transparent; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px; display: grid; grid-template-columns: 48px 1fr auto; gap: 10px 12px; align-items: center;
  }
  .card.due { border-color: rgba(251,191,36,0.5); }
  .card.low { border-color: rgba(248,113,113,0.5); }
  .dev-icon {
    width: 48px; height: 48px; border-radius: 12px; background: var(--elev);
    display: grid; place-items: center;
  }
  .dev-icon svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .name { font-weight: 650; font-size: 1rem; }
  .meta { color: var(--muted); font-size: 0.72rem; margin-top: 3px; line-height: 1.35; }
  .pct { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; text-align: right; min-width: 3rem; }
  .pct.ok { color: var(--ok); } .pct.warn { color: var(--warn); } .pct.low { color: var(--danger); }
  .bar { grid-column: 1 / -1; height: 6px; background: #222; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; }
  .actions-row { grid-column: 1 / -1; display: flex; gap: 8px; }
  .actions-row .btn { flex: 1; }
  .empty {
    text-align: center; color: var(--muted); padding: 48px 16px;
    border: 1px dashed var(--border); border-radius: 16px; line-height: 1.5;
  }
  .fab {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 14px calc(12px + var(--safe-b));
    background: linear-gradient(transparent, var(--bg) 35%);
    display: flex; justify-content: center; pointer-events: none;
  }
  .fab .btn { pointer-events: auto; width: min(100%, 420px); }
  .toast {
    position: fixed; top: calc(12px + var(--safe-t)); left: 50%; transform: translateX(-50%);
    background: #1a1a1a; border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px;
    font-size: 0.85rem; z-index: 90; opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  dialog.sheet {
    border: none; padding: 0; margin: 0; width: 100%; max-width: 100%;
    max-height: min(94dvh, 920px); border-radius: 20px 20px 0 0;
    background: #0e0e0e; color: var(--text);
    position: fixed; bottom: 0; top: auto; left: 0; right: 0;
  }
  dialog.sheet::backdrop { background: rgba(0,0,0,0.75); }
  .sheet-handle { width: 36px; height: 4px; background: #333; border-radius: 99px; margin: 10px auto 0; }
  .dlg-h { padding: 14px 18px 6px; font-weight: 700; font-size: 1.2rem; letter-spacing: -0.02em; }
  .dlg-b {
    padding: 8px 18px 12px; display: flex; flex-direction: column; gap: 16px;
    overflow-y: auto; max-height: calc(94dvh - 132px); -webkit-overflow-scrolling: touch;
  }
  .dlg-f {
    padding: 12px 18px calc(14px + var(--safe-b)); display: flex; gap: 8px;
    border-top: 1px solid var(--border);
  }
  .dlg-f .btn { flex: 1; }
  label {
    font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  input[type="text"], input[type="number"] {
    width: 100%; background: var(--elev); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 13px 14px; font-size: 1rem; min-height: 48px;
  }
  input:focus { outline: none; border-color: #555; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slider-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .slider-val { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); font-size: 0.95rem; }
  input[type="range"] { width: 100%; height: 32px; accent-color: var(--accent); }

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  @media (min-width: 400px) {
    .icon-grid { grid-template-columns: repeat(5, 1fr); }
  }
  .icon-cell {
    aspect-ratio: 1;
    border-radius: 14px;
    border: 1px solid transparent;
    background: var(--elev);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer; padding: 8px 4px;
    transition: border-color .12s, background .12s;
  }
  .icon-cell:active { transform: scale(0.96); }
  .icon-cell.selected {
    border-color: var(--accent);
    background: rgba(125, 211, 252, 0.1);
  }
  .icon-cell svg {
    width: 26px; height: 26px; stroke: #e8e8e8; fill: none;
    stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round;
  }
  .icon-cell.selected svg { stroke: var(--accent); }
  .icon-cell span {
    font-size: 0.6rem; color: var(--muted); text-align: center; line-height: 1.1;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .icon-cell.selected span { color: var(--accent); }

  @media (min-width: 640px) {
    body { max-width: 480px; margin: 0 auto; }
    dialog.sheet {
      max-width: 420px; margin: auto; border-radius: 18px;
      top: 50%; bottom: auto; left: 50%; transform: translate(-50%, -50%);
      max-height: min(88vh, 760px);
    }
    .sheet-handle { display: none; }
    .dlg-b { max-height: min(62vh, 560px); }
    .dlg-f { padding-bottom: 14px; }
    .icon-grid { grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>

<header>
  <div>
    <h1>Batteries</h1>
    <div class="sub">Track charge · learn drain · remind yourself</div>
  </div>
  <button class="icon-btn" type="button" id="btnNotif" aria-label="Enable notifications">
    <svg><use href="#i-bell"/></svg>
  </button>
</header>

<div id="list" class="list"></div>
<div class="fab"><button class="btn btn-primary" type="button" id="btnAdd">+ Device</button></div>
<div class="toast" id="toast"></div>

<dialog class="sheet" id="dlg">
  <div class="sheet-handle"></div>
  <div class="dlg-h" id="dlgTitle">Add device</div>
  <div class="dlg-b">
    <div>
      <label>Name</label>
      <input id="fName" placeholder="Optional — fills from icon" autocomplete="off">
    </div>
    <div>
      <label>Icon</label>
      <div class="icon-grid" id="iconDrawer" role="listbox" aria-label="Icons"></div>
    </div>
    <div>
      <div class="slider-top">
        <label style="margin:0">Charge</label>
        <span class="slider-val"><span id="fPctLabel">100</span>%</span>
      </div>
      <input id="fPct" type="range" min="0" max="100" value="100" step="1">
    </div>
    <div class="row2">
      <div>
        <label>Remind at %</label>
        <input id="fLow" type="number" min="1" max="50" value="20" inputmode="numeric">
      </div>
      <div>
        <label>Interval (hours)</label>
        <input id="fInterval" type="number" min="0" step="0.5" placeholder="Auto" inputmode="decimal">
      </div>
    </div>
    <div>
      <label>Learned cycle (hours)</label>
      <input id="fLife" type="number" min="0" step="0.25" placeholder="Learns over time" inputmode="decimal">
    </div>
  </div>
  <div class="dlg-f">
    <button class="btn btn-danger" type="button" id="btnDelete" hidden>Delete</button>
    <button class="btn" type="button" id="btnCancel">Cancel</button>
    <button class="btn btn-primary" type="button" id="btnSave">Save</button>
  </div>
</dialog>

<script>
const STORAGE_KEY = 'batteries_v1';

const TYPES = [
  { id: 'tws', label: 'TWS', name: 'Earbuds', keywords: ['airpod','earbuds','earbud','tws','buds','galaxy buds'] },
  { id: 'headphones', label: 'Headphones', name: 'Headphones', keywords: ['headphone','headset','sony wh','bose'] },
  { id: 'speaker', label: 'Speaker', name: 'Speaker', keywords: ['speaker','soundbar','jbl','boom'] },
  { id: 'powerbank', label: 'Power bank', name: 'Power bank', keywords: ['powerbank','power bank','anker','battery pack','magsafe battery'] },
  { id: 'laptop', label: 'Laptop', name: 'Laptop', keywords: ['laptop','macbook','notebook'] },
  { id: 'watch', label: 'Watch', name: 'Watch', keywords: ['watch','garmin','fitbit','band'] },
  { id: 'phone', label: 'Phone', name: 'Phone', keywords: ['phone','iphone','pixel','android'] },
  { id: 'tablet', label: 'Tablet', name: 'Tablet', keywords: ['tablet','ipad'] },
  { id: 'controller', label: 'Controller', name: 'Controller', keywords: ['controller','dualsense','xbox','gamepad'] },
  { id: 'mouse', label: 'Mouse', name: 'Mouse', keywords: ['mouse'] },
  { id: 'keyboard', label: 'Keyboard', name: 'Keyboard', keywords: ['keyboard','keychron'] },
  { id: 'camera', label: 'Camera', name: 'Camera', keywords: ['camera','gopro','insta360'] },
  { id: 'drone', label: 'Drone', name: 'Drone', keywords: ['drone','mavic'] },
  { id: 'ebike', label: 'E-bike', name: 'E-bike', keywords: ['e-bike','ebike'] },
  { id: 'scooter', label: 'Scooter', name: 'Scooter', keywords: ['scooter','ninebot'] },
  { id: 'toothbrush', label: 'Toothbrush', name: 'Toothbrush', keywords: ['toothbrush','oral-b','sonicare'] },
  { id: 'shaver', label: 'Shaver', name: 'Shaver', keywords: ['shaver','trimmer','razor'] },
  { id: 'calculator', label: 'Calculator', name: 'Calculator', keywords: ['calculator','ti-','casio'] },
  { id: 'flashlight', label: 'Flashlight', name: 'Flashlight', keywords: ['flashlight','torch','headlamp'] },
  { id: 'router', label: 'Hotspot', name: 'Hotspot', keywords: ['router','hotspot','mifi'] },
  { id: 'console', label: 'Console', name: 'Handheld', keywords: ['switch','steam deck','rog ally'] },
  { id: 'radio', label: 'Radio', name: 'Radio', keywords: ['radio','walkie'] },
  { id: 'light', label: 'Light', name: 'Light', keywords: ['lamp','light','bulb'] },
  { id: 'vacuum', label: 'Vacuum', name: 'Vacuum', keywords: ['vacuum','roomba','dyson'] },
  { id: 'pen', label: 'Stylus', name: 'Stylus', keywords: ['stylus','pencil','s-pen'] },
  { id: 'remote', label: 'Remote', name: 'Remote', keywords: ['remote'] },
  { id: 'ring', label: 'Ring', name: 'Smart ring', keywords: ['ring','oura'] },
  { id: 'ssd', label: 'SSD', name: 'SSD', keywords: ['ssd','external drive','t7'] },
  { id: 'monitor', label: 'Monitor', name: 'Monitor', keywords: ['monitor','display'] },
  { id: 'car', label: 'Car key', name: 'Car key', keywords: ['car key','fob','key fob'] },
  { id: 'fan', label: 'Fan', name: 'Fan', keywords: ['fan'] },
  { id: 'hearing', label: 'Hearing', name: 'Hearing aid', keywords: ['hearing'] },
  { id: 'battery', label: 'Battery', name: 'Battery', keywords: ['aa battery','18650','cell'] },
  { id: 'other', label: 'Other', name: 'Device', keywords: [] }
];

const ICON_IDS = TYPES.map(t => t.id);
const byId = Object.fromEntries(TYPES.map(t => [t.id, t]));

function svgUse(id) { return '<svg aria-hidden="true"><use href="#i-' + id + '"/></svg>'; }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { devices: [], version: 3 };
    const data = JSON.parse(raw);
    if (!data.devices) data.devices = [];
    data.devices.forEach(d => {
      if (!d.icon) d.icon = d.type || 'other';
      if (!ICON_IDS.includes(d.icon)) d.icon = 'other';
      if (d.icon === 'vape') d.icon = 'other';
    });
    return data;
  } catch { return { devices: [], version: 3 }; }
}
function save(data) {
  data.updatedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

function fmtDuration(ms) {
  if (!ms || ms <= 0 || !isFinite(ms)) return '—';
  const h = ms / 3600000;
  if (h < 1) return Math.round(ms / 60000) + 'm';
  if (h < 48) return (Math.round(h * 10) / 10) + 'h';
  return (Math.round(h / 24 * 10) / 10) + 'd';
}

function detectType(name) {
  const n = String(name || '').toLowerCase();
  for (const t of TYPES) {
    if (t.id === 'other') continue;
    if (t.keywords.some(k => n.includes(k))) return t.id;
  }
  return 'other';
}

function estimatePct(d, now = Date.now()) {
  if (d.pctManual) return clamp(d.lastPct != null ? d.lastPct : 100, 0, 100);
  if (d.manualIntervalHours && d.manualIntervalHours > 0) {
    const life = d.manualIntervalHours * 3600000;
    const elapsed = now - (d.lastChargedAt || now);
    const span = life / Math.max(0.05, (100 - (d.lowAt || 20)) / 100);
    return Math.round(100 * (1 - Math.min(1, Math.max(0, elapsed / span))));
  }
  const life = d.learnedLifeMs;
  if (!life || life <= 0) return d.lastPct != null ? d.lastPct : 100;
  const elapsed = now - (d.lastChargedAt || now);
  return Math.round(100 * (1 - Math.min(1, Math.max(0, elapsed / life))));
}

function dueAt(d) {
  const low = d.lowAt != null ? d.lowAt : 20;
  if (d.manualIntervalHours && d.manualIntervalHours > 0)
    return (d.lastChargedAt || Date.now()) + d.manualIntervalHours * 3600000;
  const life = d.learnedLifeMs;
  if (!life || !d.lastChargedAt) return null;
  return d.lastChargedAt + life * (1 - low / 100);
}

function markCharged(d, pct = 100) {
  const now = Date.now();
  if (d.lastChargedAt && d.lastChargedAt < now) {
    const cycle = now - d.lastChargedAt;
    if (cycle >= 30 * 60000 && cycle <= 30 * 86400000) {
      const prev = d.learnedLifeMs || cycle;
      d.learnedLifeMs = Math.round(prev * 0.65 + cycle * 0.35);
      d.cycles = (d.cycles || 0) + 1;
    }
  }
  d.lastChargedAt = now;
  d.lastPct = pct;
  d.pctManual = false;
  d.notifiedForCharge = null;
}

let state = load();
let editId = null;
let selectedIcon = 'other';
let nameFromIcon = true; // name still auto-managed

function renderIconDrawer() {
  document.getElementById('iconDrawer').innerHTML = TYPES.map(t => `
    <button type="button" class="icon-cell${selectedIcon === t.id ? ' selected' : ''}" data-icon="${t.id}" role="option">
      ${svgUse(t.id)}
      <span>${escapeHtml(t.label)}</span>
    </button>`).join('');
}

function selectIcon(id, { fillName } = { fillName: true }) {
  selectedIcon = ICON_IDS.includes(id) ? id : 'other';
  renderIconDrawer();
  if (fillName) {
    const t = byId[selectedIcon];
    const nameEl = document.getElementById('fName');
    if (nameFromIcon || !nameEl.value.trim()) {
      nameEl.value = t ? t.name : '';
      nameFromIcon = true;
    }
  }
}

function render() {
  const root = document.getElementById('list');
  const now = Date.now();
  if (!state.devices.length) {
    root.innerHTML = '<div class="empty">No devices yet.<br>Add earbuds, a power bank, toothbrush…</div>';
    return;
  }
  const sorted = state.devices.slice().sort((a, b) => estimatePct(a, now) - estimatePct(b, now));
  root.innerHTML = sorted.map(d => {
    const pct = estimatePct(d, now);
    const due = dueAt(d);
    const isDue = due && now >= due;
    const cls = pct <= (d.lowAt || 20) ? 'low' : (isDue ? 'due' : '');
    const pctCls = pct <= (d.lowAt || 20) ? 'low' : (pct <= 40 ? 'warn' : 'ok');
    const lifeLabel = d.manualIntervalHours
      ? `every ${d.manualIntervalHours}h`
      : (d.learnedLifeMs ? `~${fmtDuration(d.learnedLifeMs)} cycle` : 'learning…');
    const dueLabel = due ? (now >= due ? 'due now' : 'low in ' + fmtDuration(due - now)) : 'charge once to start';
    const icon = d.icon || d.type || 'other';
    const bar = pct <= 20 ? 'var(--danger)' : pct <= 40 ? 'var(--warn)' : 'var(--accent)';
    return `<article class="card ${cls}" data-id="${d.id}">
      <div class="dev-icon">${svgUse(icon)}</div>
      <div>
        <div class="name">${escapeHtml(d.name)}</div>
        <div class="meta">${escapeHtml((byId[d.type] || byId[icon] || {}).label || '')} · ${lifeLabel}<br>${dueLabel}${d.lastChargedAt ? ' · ' + fmtDuration(now - d.lastChargedAt) + ' ago' : ''}</div>
      </div>
      <div class="pct ${pctCls}">${pct}%</div>
      <div class="bar"><i style="width:${Math.max(2,pct)}%;background:${bar}"></i></div>
      <div class="actions-row">
        <button class="btn btn-ok" type="button" data-act="charged">Charged</button>
        <button class="btn" type="button" data-act="edit">Edit</button>
      </div>
    </article>`;
  }).join('');
}

document.getElementById('list').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  const card = e.target.closest('[data-id]');
  if (!card) return;
  const d = state.devices.find(x => x.id === card.dataset.id);
  if (!d) return;
  if (btn && btn.dataset.act === 'charged') {
    markCharged(d, 100); save(state); render(); scheduleChecks();
    toast(d.name + ' marked charged');
  } else if (btn && btn.dataset.act === 'edit') openEdit(d);
});

document.getElementById('iconDrawer').addEventListener('click', (e) => {
  const cell = e.target.closest('[data-icon]');
  if (!cell) return;
  selectIcon(cell.dataset.icon, { fillName: true });
});

document.getElementById('fName').addEventListener('input', () => {
  nameFromIcon = false;
  const det = detectType(document.getElementById('fName').value);
  if (det !== 'other') selectIcon(det, { fillName: false });
});

document.getElementById('fPct').addEventListener('input', () => {
  document.getElementById('fPctLabel').textContent = document.getElementById('fPct').value;
});

function openEdit(d) {
  editId = d ? d.id : null;
  nameFromIcon = !d;
  document.getElementById('dlgTitle').textContent = d ? 'Edit device' : 'Add device';
  document.getElementById('fName').value = d ? d.name : '';
  const pct = d ? (d.lastPct != null ? d.lastPct : estimatePct(d)) : 100;
  document.getElementById('fPct').value = pct;
  document.getElementById('fPctLabel').textContent = String(pct);
  document.getElementById('fLow').value = d && d.lowAt != null ? d.lowAt : 20;
  document.getElementById('fInterval').value = d && d.manualIntervalHours ? d.manualIntervalHours : '';
  document.getElementById('fLife').value = d && d.learnedLifeMs ? (d.learnedLifeMs / 3600000).toFixed(2) : '';
  selectIcon(d ? (d.icon || d.type || 'other') : 'other', { fillName: !d });
  document.getElementById('btnDelete').hidden = !d;
  document.getElementById('dlg').showModal();
}

document.getElementById('btnAdd').onclick = () => openEdit(null);
document.getElementById('btnCancel').onclick = () => document.getElementById('dlg').close();
document.getElementById('btnDelete').onclick = () => {
  if (!editId) return;
  state.devices = state.devices.filter(x => x.id !== editId);
  save(state); document.getElementById('dlg').close(); render();
};

function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body, tag: 'batteries-' + Date.now() }); } catch (_) {}
  }
  toast(title + (body ? ' — ' + body : ''));
}

document.getElementById('btnSave').onclick = async () => {
  let name = document.getElementById('fName').value.trim();
  if (!name) name = (byId[selectedIcon] || {}).name || 'Device';
  const lastPct = clamp(parseInt(document.getElementById('fPct').value, 10) || 0, 0, 100);
  const lowAt = clamp(parseInt(document.getElementById('fLow').value, 10) || 20, 1, 50);
  const intervalRaw = document.getElementById('fInterval').value;
  const lifeRaw = document.getElementById('fLife').value;
  const isNew = !editId;
  let d = editId ? state.devices.find(x => x.id === editId) : null;
  if (!d) {
    d = {
      id: uid(), name, type: selectedIcon, icon: selectedIcon,
      lastChargedAt: Date.now(), lastPct, lowAt, cycles: 0, pctManual: true
    };
    state.devices.push(d);
  } else {
    d.name = name; d.type = selectedIcon; d.icon = selectedIcon;
    d.lastPct = lastPct; d.lowAt = lowAt; d.pctManual = true;
  }
  if (intervalRaw === '' || intervalRaw == null) d.manualIntervalHours = null;
  else d.manualIntervalHours = Math.max(0, parseFloat(intervalRaw) || 0) || null;
  if (lifeRaw !== '' && lifeRaw != null) {
    const h = parseFloat(lifeRaw);
    if (h > 0) d.learnedLifeMs = Math.round(h * 3600000);
  }
  save(state);
  document.getElementById('dlg').close();
  render();
  scheduleChecks();

  if (isNew) {
    if ('Notification' in window && Notification.permission === 'default') {
      try { await Notification.requestPermission(); } catch (_) {}
    }
    notify(d.name + ' added', 'Battery at ' + lastPct + '%');
  }
};

document.getElementById('btnNotif').onclick = async () => {
  if (!('Notification' in window)) return toast('Notifications unavailable');
  const r = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  toast(r === 'granted' ? 'Notifications enabled' : 'Notifications blocked');
};

function maybeNotify(d, now) {
  const due = dueAt(d);
  if (!due || now < due) return;
  if (d.notifiedForCharge === d.lastChargedAt) return;
  d.notifiedForCharge = d.lastChargedAt;
  notify(d.name + ' battery low', 'Estimated ~' + estimatePct(d, now) + '% — time to charge.');
}

function scheduleChecks() {
  const now = Date.now();
  let changed = false;
  state.devices.forEach(d => {
    const before = d.notifiedForCharge;
    maybeNotify(d, now);
    if (d.notifiedForCharge !== before) changed = true;
  });
  if (changed) save(state);
  render();
}

render();
scheduleChecks();
setInterval(scheduleChecks, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleChecks(); });
</script>
</body>
</html>
