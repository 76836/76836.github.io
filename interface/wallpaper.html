<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wallpaper Loader</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #container { width: 100vw; height: 100vh; position: relative; }
        img, video, iframe {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover; border: none;
        }
        #unmute-btn {
            position: fixed; bottom: 16px; right: 16px; z-index: 999;
            background: rgba(0,0,0,0.6); color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 14px; cursor: pointer; font-size: 0.8rem;
            display: none;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <button id="unmute-btn" onclick="userUnmute()">🔊 TAP TO UNMUTE</button>
    <script>
const params = new URLSearchParams(window.location.search);
const appid = params.get('appid');
const defaultUrl = params.get('default');
const request = indexedDB.open("WallpaperDB");
let activeAnimated = null;
request.onupgradeneeded = e => {
  const db = e.target.result;
  if (!db.objectStoreNames.contains("library")) db.createObjectStore("library", { keyPath: "id", autoIncrement: true });
  if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "appid" });
  if (!db.objectStoreNames.contains("thumbnails")) db.createObjectStore("thumbnails", { keyPath: "key" });
  if (!db.objectStoreNames.contains("apps")) db.createObjectStore("apps", { keyPath: "appid" });
};
request.onsuccess = e => {
  const db = e.target.result;
  if (appid && db.objectStoreNames.contains("apps")) {
    db.transaction("apps", "readwrite").objectStore("apps").put({ appid, seenAt: Date.now() });
  }
  if (!appid || !db.objectStoreNames.contains("settings")) return tryDefault(db);
  db.transaction("settings").objectStore("settings").get(appid).onsuccess = async ev => {
    const cfg = ev.target.result;
    if (!cfg) return tryDefault(db);
    const resolved = await resolveWallpaper(db, cfg);
    render(resolved.type, resolved.content, cfg.muted, resolved.thumb);
  };
};
request.onerror = () => tryDefault(null);
function reqP(req){ return new Promise((r,j)=>{req.onsuccess=()=>r(req.result); req.onerror=()=>j(req.error);}); }
async function resolveWallpaper(db, cfg) {
  if (!cfg.wallpaperId) return { type: cfg.type, content: cfg.content || '', thumb: '' };
  const item = await reqP(db.transaction('library').objectStore('library').get(cfg.wallpaperId));
  if (!item) return { type: cfg.type, content: cfg.content || '', thumb: '' };
  const key = 'lib:' + item.id + ':' + item.type + ':' + (item.added||0) + ':' + (item.content||'').slice(0,64);
  const thumbRec = await reqP(db.transaction('thumbnails').objectStore('thumbnails').get(key));
  return { type: item.type, content: item.content, thumb: (thumbRec && thumbRec.data) || '' };
}
function tryDefault(db) {
  if (db && appid && db.objectStoreNames.contains("settings")) {
    const tx = db.transaction("settings", "readwrite").objectStore("settings");
    tx.get(appid).onsuccess = e => {
      if (!e.target.result) tx.put({ appid, name: appid, type: "image", content: "", muted: true, history: [], added: Date.now() });
    };
  }
  if (!defaultUrl) return;
  const type = detectType(defaultUrl);
  render(type, defaultUrl, true, '');
}
function detectType(url){ const clean=(url||'').split('?')[0].toLowerCase(); if(/\.(mp4|webm|mov|ogg)$/.test(clean)) return 'video'; if(/\.(html?|php|aspx?)$/.test(clean)) return 'page'; if(!/\.(jpe?g|png|gif|webp|avif|svg|bmp)$/.test(clean)) return 'page'; return 'image'; }
function render(type, content, muted, thumb) {
  const container = document.getElementById('container'); container.innerHTML='';
  if (thumb) { const t = new Image(); t.src = thumb; t.style.filter='blur(1px)'; container.appendChild(t); }
  if (type === 'page') { if (content.startsWith('data:') || content.startsWith('blob:')) { const f = document.createElement('iframe'); f.src = content; f.sandbox='allow-scripts allow-same-origin allow-forms'; requestAnimationFrame(()=>container.appendChild(f)); } else window.location.replace(content); return; }
  if (type === 'video') { const v=document.createElement('video'); v.src=content; v.autoplay=true; v.loop=true; v.playsInline=true; v.preload='metadata'; v.muted=true; v.addEventListener('canplay',()=>requestAnimationFrame(()=>container.appendChild(v)),{once:true}); v.play().then(()=>{if(muted===false){v.muted=false;if(v.muted) showUnmuteBtn(v);}}).catch(()=>{}); activeAnimated=v; return; }
  const img = new Image(); img.decoding='async'; img.onload=()=>requestAnimationFrame(()=>container.appendChild(img)); img.src=content;
}
document.addEventListener('visibilitychange', () => { if (!activeAnimated) return; if (document.visibilityState === 'hidden') activeAnimated.pause?.(); else activeAnimated.play?.().catch(()=>{}); });
function showUnmuteBtn(vid){ const btn=document.getElementById('unmute-btn'); btn.style.display='block'; btn._vid=vid; }
function userUnmute(){ const btn=document.getElementById('unmute-btn'); if(btn._vid) btn._vid.muted=false; btn.style.display='none'; }
</script>
</body>
</html>
